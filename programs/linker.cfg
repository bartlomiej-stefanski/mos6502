# Reference for the code written here: https://cc65.github.io/doc/ld65.html

# Memory map (custom):
# +----------------------------+--------+---------+
# | Section                    | Start  | Size    |
# +----------------------------+--------+---------+
# | ZP                         | $0000  | 0x0100  |
# +----------------------------+--------+---------+
# | RAM                        | $0100  | 0x7F00  |
# +----------------------------+--------+---------+
# | Unused                     | $8000  | 0x6000  |
# +----------------------------+--------+---------+
# | ROM                        | $E000  | 0x2000  |
# +----------------------------+--------+---------+

MEMORY {
  ZP:  start = $0000, size = $0100, type = rw, define = yes;
  RAM: start = $0100, size = $7F00, type = rw, define = yes;

  # Virtual constraint on ROM, all memory is read-write.
  ROM: start = $E000, size = $2000, type = ro, file = %O;
}

SEGMENTS {
  ZEROPAGE: load = ZP,  type = zp;
  BSS:      load = RAM, type = bss, define = yes;
  DATA:     load = ROM, run = RAM, type = rw, define = yes;
  RODATA:   load = ROM, type = ro;

  CODE:     load = ROM, type = ro;
  STARTUP:  load = ROM, type = ro;
  ONCE:     load = ROM, type = ro,  optional = yes;

  VECTORS:  load = ROM, type = ro, start = $FFFA;
}

SYMBOLS {
  # Program-stack for c runtime.
  __STACKSTART__: type = weak, value = $8000;
  __STACKSIZE__: type = weak, value = $800;
}

FEATURES {
  CONDES: segment = RODATA, type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__;
  CONDES: segment = RODATA, type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__;
  CONDES: segment = RODATA, type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__;
}
